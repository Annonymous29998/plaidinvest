<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Investment Scheme | Withdraw</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/guard-tamper.js"></script>
  <script src="/js/guard-devtools.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/guard-auth.js"></script>
  <script src="/js/session-timeout.js"></script>
</head>
<body class="min-h-full bg-gray-950 text-gray-100 antialiased dash-app">

  <header class="app-header">
    <div class="header-inner">
      <a href="/index.html" class="text-logo"><span class="text-logo-mark">₿</span><span data-logo-text>Investment Scheme</span></a>
      <nav class="desktop-nav hidden sm:flex gap-3 items-center">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/dashboard/plans.html" class="nav-link">Plans</a>
        <a href="/dashboard/deposits.html" class="nav-link">Deposits</a>
        <a href="/dashboard/withdrawals.html" class="nav-link nav-withdraw-link">Withdraw</a>
        <a href="/dashboard/accounthistory.html" class="nav-link">History</a>
        <button type="button" data-logout class="nav-link">Logout</button>
      </nav>
      <div class="dash-header-actions dash-mobile-only">
        <button type="button" class="dash-profile-btn" id="dash-profile-btn" aria-label="Profile">
          <span data-user-initials>Je</span>
        </button>
      </div>
      <button id="dash-menu-btn" class="dash-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <nav id="dash-mobile-nav" class="dash-mobile-nav">
      <a href="/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/dashboard/plans.html" class="nav-link">Plans</a>
      <a href="/dashboard/deposits.html" class="nav-link">Deposits</a>
      <a href="/dashboard/withdrawals.html" class="nav-link nav-withdraw-link">Withdraw</a>
      <a href="/dashboard/accounthistory.html" class="nav-link">History</a>
      <button type="button" data-logout class="nav-link text-left">Logout</button>
    </nav>
  </header>

  <main class="page-main page-main--narrow">
    <div class="page-heading">
      <h1>Withdraw Funds</h1>
      <p>Withdraw from your <span data-logo-text>Investment Scheme</span> account.</p>
    </div>

    <form id="withdraw-form" class="app-card p-5 sm:p-6 form-stack">
      <div id="withdraw-fields" class="form-stack">
      <div>
        <label class="form-label" for="withdraw-amount">Withdrawal amount (USD)</label>
        <input id="withdraw-amount" type="number" min="100" step="1" placeholder="1000" required class="form-input">
        <p class="text-xs text-gray-500 mt-1">Available: <span id="withdraw-available">$15,500.00</span></p>
      </div>
      <div id="withdraw-wallet-wrap" class="hidden">
        <label class="form-label" for="withdraw-wallet">Wallet to withdraw to</label>
        <input id="withdraw-wallet" type="text" placeholder="bc1q… paste your BTC wallet" class="form-input font-mono text-sm" autocomplete="off">
        <p class="text-xs text-gray-500 mt-1">Enter the BTC address where you want your funds sent.</p>
      </div>
      <p id="withdraw-error" class="text-red-400 text-sm hidden"></p>
      <p id="withdraw-success" class="text-green-400 text-sm hidden"></p>
      <button type="submit" class="btn-primary w-full py-3">Continue</button>
      </div>
    </form>
    <p class="text-center text-sm text-gray-500 mt-6"><a href="/dashboard.html" class="text-primary">← Back to dashboard</a></p>
  </main>

  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/account-sync.js"></script>
  <script src="/js/price.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/mobile-nav.js"></script>
  <script src="/js/wallet-modal.js"></script>
  <script src="/js/withdraw-fee-proof.js"></script>
  <script src="/js/withdrawals-page.js"></script>
</body>
</html>
